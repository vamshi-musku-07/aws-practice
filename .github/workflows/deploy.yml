
name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws-practice-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Add the server host key to known_hosts.
          # For production, verify this fingerprint independently.
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
              set -eu

              echo "Starting backend deployment..."

              cd ~/aws-practice

              echo "Pulling latest code..."
              git pull --ff-only origin main

              cd backend

              echo "Installing dependencies..."
              if [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi

              echo "Restarting PM2 process..."
              pm2 restart aws-practice-api --update-env

              echo "Current PM2 status:"
              pm2 status

              echo "Waiting for API health check..."

              HEALTH_URL="http://localhost:3000/api/health"

              for i in $(seq 1 15); do
                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 3 \
                  "$HEALTH_URL"; then
                  echo
                  echo "Deployment and health check succeeded."
                  exit 0
                fi

                echo "API not ready yet (attempt $i/15)."

                if [ "$i" -lt 15 ]; then
                  sleep 2
                fi
              done

              echo "Health check failed after retries."
              echo "Recent PM2 logs:"
              pm2 logs aws-practice-api --lines 50 --nostream || true

              exit 1
          REMOTE
